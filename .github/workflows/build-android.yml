name: Build Android Debug APK

# Runs on every push to main, and can also be triggered manually from the
# Actions tab (the workflow_dispatch line below adds a "Run workflow" button).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java (needed for Gradle/Android build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # GitHub's Ubuntu runners come with the Android SDK pre-installed —
      # no separate SDK setup step needed.

      - name: Install dependencies
        run: npm install

      - name: Add Android platform (first run only)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Patch AndroidManifest.xml (login callback intent-filter)
        run: node scripts/patch-android-manifest.js

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kikundify-budget-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
